server.port=8080
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/}

app.data-dir=./data
app.jwt.secret=${JWT_SECRET:change-me-in-production-change-me-in-production-change-me}
app.jwt.expiration-hours=24
app.persistence.snapshot-interval-seconds=30

# Autoriser le frontend en dev
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:8080

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.com.family.tree=INFO
