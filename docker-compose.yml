services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      # Doit être le nom DNS du service backend sur le réseau Docker
      - BACKEND_HOST=backend
      - BACKEND_CONTEXT_PATH=/vibe-genealogy
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
      - SERVER_SERVLET_CONTEXT_PATH=/vibe-genealogy
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-change-me-in-production-change-me}
      # CORS : origine publique HTTPS (NPM) + accès direct
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,https://app.infovergne.com}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
